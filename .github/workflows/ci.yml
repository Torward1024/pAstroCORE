name: CI

on:
  push:
    branches: [ main, master ]
  # Also on every pull request: a suite that only runs after a merge cannot stop anything.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung test should fail the build in minutes, not occupy a runner until it is noticed.
    timeout-minutes: 15

    strategy:
      # Every Python `requires-python` promises, which is 3.12 and 3.13 while PySide6 caps at
      # `<3.14`. Only 3.12 was ever run, and a promised version nothing runs is a claim: on the
      # same day, msb_arch found two interpreters it had been broken on for a year that way.
      # One version failing must not hide the rest, so the matrix does not stop at the first.
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    name: test (Python ${{ matrix.python-version }})

    env:
      # Qt has no display on a build machine; the offscreen platform is how it runs anyway.
      QT_QPA_PLATFORM: offscreen

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        # Keyed on the file that decides the dependencies, not on the one that installs them.
        # `requirements.txt` is `-e .` and never changes, so the restored cache -- which holds
        # pip's cached index pages, not only wheels -- outlived a pin it no longer satisfied:
        # raising the msb_arch pin to a release ten minutes old failed with "no matching
        # distribution", from a package listing that predated it. Pinning the key to
        # pyproject.toml means a changed dependency gets a fresh look at the index.
        cache-dependency-path: |
          requirements.txt
          pyproject.toml

    # PySide6 needs these to load even offscreen.
    - name: Install system libraries Qt links against
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-timeout

    # `python -m pytest` rather than `pytest`: the module form puts the working directory on
    # sys.path, which is how the suite is run locally. With the bare command CI could not
    # import pastrocore at all, and the two ways of running had quietly diverged.
    - name: Check the model layer imports
      run: python -c "from pastrocore.super.schedule_manipulator import ScheduleManipulator; print('ok')"

    # The characterization tests are the point of this workflow: they recompute the fixture
    # project and compare against the results it was saved holding, so a change to any formula
    # fails the build rather than reaching a user.
    - name: Characterization tests
      run: python -m pytest tests/test_characterization.py -v

    - name: Project round trip
      run: python -m pytest tests/test_project_round_trip.py -v

    - name: GUI smoke tests
      run: python -m pytest tests/test_gui_smoke.py -v --timeout=60 --timeout-method=thread

    # `-v` rather than `-q`: a build that dies mid-run has to say where. A segfault takes the
    # process with it, so there is no report at the end -- the last line of the log is the only
    # evidence there will be, and with `-q` that line is a dot.
    - name: Everything
      run: python -m pytest tests/ -v --timeout=120 --timeout-method=thread
