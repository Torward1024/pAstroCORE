name: Release

# A tag builds the downloads and attaches them to the release. It also runs on demand, so a
# change to the packaging can be tried on all three platforms without releasing anything.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # Each platform is its own evidence. One failing build should not hide the other two.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows installer
          - os: macos-latest
            name: macOS disk image
          # The oldest runner still supported: an AppImage runs on the glibc it was built
          # against and anything newer, so building on the newest makes it run on the fewest.
          - os: ubuntu-22.04
            name: Linux AppImage

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip

    # Qt links against these even when it never opens a window.
    - name: Install the libraries Qt and AppImage need
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
                                libxcb-cursor0 libfuse2 desktop-file-utils
        curl -sSLo /usr/local/bin/appimagetool \
          https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x /usr/local/bin/appimagetool

    # Only what the application needs, and the two tools that wrap it. PyInstaller ships
    # whatever it can import, so anything else installed here would be in the download.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pillow

    - name: Build the download
      run: python tools/make_download.py

    - name: Write a project for the build to open
      run: python tools/write_fixture.py "${{ runner.temp }}/survey.pastro"

    # What a user does, done by the machine: install it, start what was installed, and read
    # the line it prints. A download that does not start is a failed build.
    - name: Install it and start it (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $installer = Get-ChildItem dist/pAstroCORE-*-windows-x64.exe | Select-Object -First 1
        Start-Process -FilePath $installer.FullName -ArgumentList `
          '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait
        $installed = Join-Path $env:LOCALAPPDATA 'Programs\pAstroCORE\pAstroCORE.exe'
        if (-not (Test-Path $installed)) { throw "the installer left nothing at $installed" }
        # Started rather than called: a windowed program is not waited for by a shell, and
        # `$LASTEXITCODE` came back empty from one that had started, run and exited 0.
        $run = Start-Process -FilePath $installed -Wait -PassThru -NoNewWindow `
          -ArgumentList '--selftest', "${{ runner.temp }}/survey.pastro"
        if ($run.ExitCode -ne 0) { throw "the installed application exited $($run.ExitCode)" }

    - name: Install it and start it (macOS)
      if: runner.os == 'macOS'
      run: |
        image=$(ls dist/pAstroCORE-*.dmg | head -1)
        hdiutil attach "$image" -mountpoint /Volumes/pAstroCORE -nobrowse -quiet
        cp -R /Volumes/pAstroCORE/pAstroCORE.app "$RUNNER_TEMP/"
        hdiutil detach /Volumes/pAstroCORE -quiet
        "$RUNNER_TEMP/pAstroCORE.app/Contents/MacOS/pAstroCORE" --selftest \
          "$RUNNER_TEMP/survey.pastro"

    - name: Start it (Linux)
      if: runner.os == 'Linux'
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        image=$(ls dist/pAstroCORE-*.AppImage | head -1)
        chmod +x "$image"
        "$image" --selftest "$RUNNER_TEMP/survey.pastro"

    # A download nobody will wait for is a download nobody installs. This is a ceiling
    # rather than a measurement: it fails when something large is shipped by accident.
    - name: Check how big it came out
      shell: bash
      run: |
        for file in dist/pAstroCORE-*.exe dist/pAstroCORE-*.dmg dist/pAstroCORE-*.AppImage; do
          [ -f "$file" ] || continue
          size=$(python -c "import os,sys; print(os.path.getsize(sys.argv[1]) // 1000000)" "$file")
          echo "$file is $size MB"
          [ "$size" -lt 500 ] || { echo "::error::$file is $size MB"; exit 1; }
        done

    - name: Keep the download
      uses: actions/upload-artifact@v4
      with:
        name: ${{ runner.os }}
        path: |
          dist/pAstroCORE-*.exe
          dist/pAstroCORE-*.dmg
          dist/pAstroCORE-*.AppImage
        if-no-files-found: error

  release:
    name: Attach them to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # The page links at files by name, and every name carries the version. A tag that does
    # not match it would publish a page whose three links lead nowhere.
    - name: Check the download page names this version
      run: |
        version=$(grep -oP '__version__ = "\K[^"]+' pastrocore/__init__.py)
        tag="${GITHUB_REF_NAME#v}"
        [ "$version" = "$tag" ] || { echo "::error::tag $tag, package $version"; exit 1; }
        grep -q "releases/download/v$version/" docs/download.md \
          || { echo "::error::docs/download.md does not link at v$version"; exit 1; }

    - name: Collect every download
      uses: actions/download-artifact@v4
      with:
        path: downloads
        merge-multiple: true

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: downloads/*
        fail_on_unmatched_files: true
        generate_release_notes: true
