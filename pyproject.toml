[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pastrocore"
# The version lives in one place: `pastrocore.__version__`. MSB carried it in two, tagged
# 1.1.2 with only one of them bumped, built 1.1.1 again and PyPI refused it as a file it
# already had. Two sources of one number is one too many.
dynamic = ["version"]
description = "Planning and checking VLBI schedules, ground and space"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "Alexey Rudnitskiy", email = "almax1024@gmail.com"}
]
keywords = ["vlbi", "astronomy", "scheduling", "radio interferometry"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: Other/Proprietary License",
    "Topic :: Scientific/Engineering :: Astronomy",
]

# Pinned where a version has been verified against the fixture project, floating where the
# interface is stable. `requirements.txt` installs this file, so there is one list rather than
# two that drift.
dependencies = [
    "msb_arch>=1.5.0",
    "astropy==7.0.1",
    "astropy-iers-data>=0.2025.3.10.0.29.26",
    "matplotlib==3.10.0",
    "numpy==2.2.2",
    "polars==1.34.0",
    "psutil==6.1.1",
    "pyarrow==21.0.0",
    "pyerfa==2.0.1.5",
    "PySide6==6.8.2.1",
    "python-dateutil==2.9.0.post0",
    "python-json-logger==3.2.1",
    "scipy==1.15.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build>=1.0",
]

# `pastrocore` starts the window. `run.py` still works and does the same thing, for anyone
# running from a checkout.
[project.scripts]
pastrocore = "pastrocore.app:main"

[project.urls]
Homepage = "https://github.com/Torward1024/pAstroCORE"
Repository = "https://github.com/Torward1024/pAstroCORE"
Issues = "https://github.com/Torward1024/pAstroCORE/issues"

[tool.hatch.build.targets.wheel]
packages = ["pastrocore"]

[tool.hatch.version]
path = "pastrocore/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: builds a wheel or otherwise costs seconds rather than milliseconds",
]
